o\"><div class=\"badge\">SCIENCE 4 • TERM 2 • WEEK 8<\/div><h1>🧲 Magnet Rush!<\/h1><p>Move your magnet, catch the magnetic objects and dodge the rest. Watch the invisible force at work!<\/p><\/header>\n <section class=\"panel\"><h2>How to play<\/h2><div class=\"how\">\n <div><b>🖱 Move the magnet<\/b>Drag with mouse or finger (or arrow keys). The glowing ring shows the force field.<\/div>\n <div><b>✅ Catch magnetic things<\/b>📎🔩 are pulled in without touching! +10 points. Non-magnetic items cost −5.<\/div>\n <div><b>🔄 Flip the pole<\/b>Press Space or the button. Little magnets are pulled in by the <u>opposite<\/u> pole and pushed away by the <u>same<\/u> pole.<\/div>\n <div><b>⭐ Power-up star<\/b>Catch it to answer a science question. Correct = +25 and ⚡ Super Pull!<\/div><\/div><\/section>\n <section class=\"panel\"><h2>Choose how to play<\/h2>\n <div class=\"seg\"><button data-act=\"mode\" data-v=\"solo\" class=\"${team?'':'on'}\">🙋 Solo Player<\/button><button data-act=\"mode\" data-v=\"team\" class=\"${team?'on':''}\">👥 Team Play<\/button><\/div>\n ${team?`<div class=\"cnt\">Teams: ${[2,3,4].map(n=>`<button data-act=\"nt\" data-v=\"${n}\" class=\"${s.nTeams==n?'on':''}\">${n}<\/button>`).join('')}<\/div>\n <div class=\"teams\">${s.teams.slice(0,s.nTeams).map((t,i)=>`<input type=\"text\" data-f=\"team\" data-i=\"${i}\" value=\"${esc(t)}\" maxlength=\"20\" style=\"border-color:${TC[i]}\" aria-label=\"Team ${i+1} name\">`).join('')}<\/div>\n <p class=\"hint\">In team play, the total time is shared equally — every team gets one turn (${Math.floor(s.time/s.nTeams)}s each).<\/p>`:''}\n <div class=\"row\"><label>⏱ Total timer (seconds)<input type=\"number\" data-f=\"time\" min=\"30\" max=\"900\" step=\"30\" value=\"${s.time}\"><\/label><label><input type=\"checkbox\" data-f=\"snd\" ${s.sound?'checked':''}> 🔊 Sound<\/label><\/div><\/section>\n <div class=\"acts\"><button class=\"btn pri big\" data-act=\"play\">▶ PLAY<\/button><button class=\"btn big\" data-act=\"edit\">✏️ Edit Game<\/button><button class=\"btn big\" data-act=\"dl\">⬇️ Download<\/button><\/div>`;\n}\n\n/* ---------- GAME ---------- */\nfunction play(){\n const s=D.settings,n=s.mode==='team'?s.nTeams:1;\n G={n,sc:Array(n).fill(0),cur:0,turnT:Math.max(20,Math.floor(s.time/n)),caught:0,wrong:0,qok:0,qn:0};\n app.innerHTML=`<div class=\"top\"><button class=\"btn sm\" data-act=\"quit\">✖ Quit<\/button><div class=\"name\" id=\"who\"><\/div><div class=\"clock\" id=\"clk\"><\/div><\/div><div class=\"tbar\"><i id=\"tb\"><\/i><\/div><div class=\"score\" id=\"sb\"><\/div>\n <div class=\"stage\"><canvas id=\"cv\" width=\"${W}\" height=\"${H}\"><\/canvas><div class=\"ov\" id=\"ov\"><\/div><\/div>\n <div class=\"acts\"><button class=\"btn pri big\" data-act=\"flip\">🔄 Flip Pole (Space)<\/button><\/div>`;\n cv=$('#cv');ctx=cv.getContext('2d');cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',mv);\n ready();\n}\nfunction mv(e){if(!R)return;const r=cv.getBoundingClientRect();R.tx=(e.clientX-r.left)*W/r.width;R.ty=Math.max(170,Math.min(H-40,(e.clientY-r.top)*H/r.height))}\nfunction ready(){\n const s=D.settings,team=G.n>1;\n R={t:G.turnT,el:0,items:[],fx:[],pt:[],combo:0,sup:0,mx:W/2,my:H-90,tx:W/2,ty:H-90,pole:'N',spawn:.4,star:7,shake:0,state:'ready'};\n lastHud='';$('#who').textContent=team?'👉 '+s.teams[G.cur]:'🧲 Magnet Rush';\n showOv(`<div class=\"card2\"><div class=\"badge\">${team?'TEAM TURN':'GET READY'}<\/div><h2>${team?esc(s.teams[G.cur])+\", you're up!\":'Ready, scientist?'}<\/h2><p>⏱ <b>${fmt(G.turnT)}<\/b> to catch as many <b>magnetic<\/b> objects as you can.<\/p><p class=\"hint\">Drag to move the magnet • Space / 🔄 flips its pole<\/p><button class=\"btn pri big\" data-act=\"go\">▶ Start<\/button><\/div>`);\n draw();hud();\n}\nconst mult=()=>Math.min(4,1+Math.floor(R.combo/3));\nfunction loop(now){\n if(!G||!R)return;\n const dt=Math.min(.033,(now-last)/1000);last=now;\n if(R.state==='play')update(dt);\n draw();hud();\n if(R.state==='play'||R.state==='quiz')raf=requestAnimationFrame(loop);\n}\nfunction spawn(kind){\n const mg=D.items.filter(i=>i.m&&i.n),nn=D.items.filter(i=>!i.m&&i.n),rnd=a=>a[Math.random()*a.length|0];\n let t=kind;if(!t){const r=Math.random();t=r<.42?'obj':r<.72?'non':'mag'}\n if(t==='obj'&&!mg.length)t='non';if(t==='non'&&!nn.length)t=mg.length?'obj':'mag';\n const it={t,x:40+Math.random()*(W-80),y:-30,vx:0,vy:80,pole:Math.random()<.5?'N':'S',pull:0};\n if(t==='obj'){const d=rnd(mg);it.e=d.e;it.n=d.n}else if(t==='non'){const d=rnd(nn);it.e=d.e;it.n=d.n}\n R.items.push(it);\n}\nfunction add(p){G.sc[G.cur]=Math.max(0,G.sc[G.cur]+p)}\nfunction fx(x,y,s,c){R.fx.push({x:Math.max(60,Math.min(W-60,x)),y,s,c,l:1})}\nfunction burst(x,y,c){for(let i=0;i<12;i++){const a=Math.random()*6.28,v=60+Math.random()*140;R.pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6,c})}}\nfunction update(dt){\n R.t-=dt;R.el+=dt;if(R.t<=0){R.t=0;endTurn();return}\n const k=Math.min(1,dt*12);R.mx+=(R.tx-R.mx)*k;R.my+=(R.ty-R.my)*k;\n if(R.sup>0)R.sup-=dt;\n R.spawn-=dt;if(R.spawn<=0){spawn();R.spawn=Math.max(.4,.95-R.el*.004)}\n R.star-=dt;if(R.star<=0){spawn('star');R.star=11}\n const Rr=R.sup>0?290:190,fall=95+Math.min(110,R.el*.9);\n for(const it of R.items){\n  if(R.state!=='play')break;\n  it.vy+=(fall-it.vy)*1.2*dt;it.vx*=1-Math.min(1,2*dt);it.pull=0;\n  const dx=R.mx-it.x,dy=R.my-it.y,d=Math.hypot(dx,dy)||1;\n  if(it.t!=='non'&&d<Rr){\n   const sg=it.t==='mag'?(it.pole!==R.pole?1:-1):1,a=(2600*(1-d/Rr)+300)*sg;\n   it.vx+=dx/d*a*dt;it.vy+=dy/d*a*dt;it.pull=sg;\n  }\n  it.x+=it.vx*dt;it.y+=it.vy*dt;\n  if(d<40){\n   if(it.t==='non'){it.dead=1;add(-5);R.combo=0;R.shake=.3;G.wrong++;fx(it.x,it.y,'Not magnetic! −5','#f87171');beep(180,.2)}\n   else if(it.t==='star'){it.dead=1;R.combo++;burst(it.x,it.y,'#fde047');quiz()}\n   else if(it.t==='obj'||it.pole!==R.pole){it.dead=1;R.combo++;const p=(it.t==='mag'?15:10)*mult();add(p);G.caught++;fx(it.x,it.y,'+'+p+(mult()>1?' ×'+mult():''),'#4ade80');burst(it.x,it.y,it.t==='mag'?PC[it.pole]:'#facc15');beep(650+R.combo*25,.08)}\n  }\n  if(it.y>H+50||it.x<-60||it.x>W+60){it.dead=1;if(it.t==='obj')R.combo=0}\n }\n R.items=R.items.filter(i=>!i.dead);\n R.fx.forEach(f=>{f.y-=45*dt;f.l-=dt*.8});R.fx=R.fx.filter(f=>f.l>0);\n R.pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});R.pt=R.pt.filter(p=>p.l>0);\n}\nfunction quiz(){\n const bank=D.qs.filter(q=>q.q.trim()&&q.o.length>1);\n if(!bank.length){add(25);R.sup=10;fx(R.mx,R.my-60,'⚡ +25 Super Pull!','#fde047');return}\n const q=bank[Math.random()*bank.length|0];R.qo=shuffle(q.o.map((t,i)=>({t,c:i===q.a})));R.state='quiz';R.ql=0;\n showOv(`<div class=\"card2\"><div class=\"badge\">⭐ POWER-UP QUESTION<\/div><h2 style=\"margin-top:10px\">${esc(q.q)}<\/h2><div class=\"opts\">${R.qo.map((x,i)=>`<button class=\"opt\" data-act=\"qa\" data-i=\"${i}\"><span>${'ABCD'[i]}<\/span>${esc(x.t)}<\/button>`).join('')}<\/div><div class=\"fb\" id=\"fb\"><\/div><\/div>`);\n}\nfunction answerQ(i){\n if(!R||R.state!=='quiz'||R.ql)return;R.ql=1;G.qn++;\n const ok=R.qo[i].c,bs=[...document.querySelectorAll('.ov .opt')];\n bs.forEach((b,k)=>{b.disabled=true;if(R.qo[k].c)b.classList.add('good')});\n if(ok){G.qok++;add(25);R.sup=10;$('#fb').textContent='✅ Correct! +25 and ⚡ Super Pull!';$('#fb').style.color='#16a34a';beep(880,.2)}\n else{bs[i].classList.add('bad');$('#fb').textContent='❌ The answer is: '+R.qo.find(x=>x.c).t;$('#fb').style.color='#dc2626';beep(200,.25)}\n setTimeout(()=>{if(!G||!R||R.state!=='quiz')return;hideOv();R.state='play'},ok?900:1700);\n}\nfunction flipPole(){if(R&&R.state==='play'){R.pole=R.pole==='N'?'S':'N';beep(500,.05)}}\nfunction endTurn(){\n R.state='end';cancelAnimationFrame(raf);beep(660,.35);draw();hud();\n if(G.cur<G.n-1)showOv(`<div class=\"card2\"><h2>⏰ Time's up!<\/h2><p><b>${esc(D.settings.teams[G.cur])}<\/b> scored <b>${G.sc[G.cur]}<\/b> points.<\/p><button class=\"btn pri big\" data-act=\"next\">Next team ▶<\/button><\/div>`);\n else setTimeout(results,600);\n}\nfunction hud(){\n if(!G||!R)return;const s=D.settings,m=mult();\n $('#clk').textContent=fmt(Math.max(0,Math.ceil(R.t)));$('#clk').classList.toggle('warn',R.t<=30&&R.state!=='ready');\n $('#tb').style.width=Math.max(0,R.t/G.turnT*100)+'%';\n let h=G.n>1?G.sc.map((v,i)=>`<span class=\"${i===G.cur?'act':''}\" style=\"--c:${TC[i]}\">${esc(s.teams[i])}: ${v}<\/span>`).join(''):`<span>⭐ ${G.sc[0]}<\/span>`;\n h+=`<span>🔥 Combo ${R.combo}${m>1?' ×'+m:''}<\/span>`+(R.sup>0?`<span class=\"act\" style=\"--c:#eab308\">⚡ Super Pull ${Math.ceil(R.sup)}s<\/span>`:'')+`<span>Pole: <b style=\"color:${PC[R.pole]}\">${R.pole}<\/b><\/span>`;\n if(h!==lastHud){$('#sb').innerHTML=h;lastHud=h}\n}\nfunction results(){\n if(!G)return;const s=D.settings;let body;\n if(G.n>1){\n  const r=G.sc.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v),top=r[0].v,w=r.filter(x=>x.v===top);\n  body=`<div class=\"big\">🏆<\/div><h1>${w.length>1?\"It's a tie!\":esc(s.teams[w[0].i])+' wins!'}<\/h1>`+r.map((x,k)=>`<div class=\"rank ${x.v===top?'win':''}\" style=\"--c:${TC[x.i]}\">${['🥇','🥈','🥉','4️⃣'][k]} ${esc(s.teams[x.i])}<em>${x.v} pts<\/em><\/div>`).join('')+`<p class=\"hint\">${G.caught} objects caught • ${G.qok}/${G.qn} power-up questions correct<\/p>`;\n }else body=`<div class=\"big\">${G.sc[0]>=300?'🌟':G.sc[0]>=150?'👍':'💪'}<\/div><h1>Time's up!<\/h1><div class=\"big\" style=\"color:#6366f1\">${G.sc[0]} pts<\/div><p><b>${G.caught}<\/b> objects caught • <b>${G.wrong}<\/b> non-magnetic hits • <b>${G.qok}/${G.qn}<\/b> questions correct<\/p><p class=\"hint\">${G.sc[0]>=300?'Magnet master!':'Play again to beat your score!'}<\/p>`;\n cancelAnimationFrame(raf);\n app.innerHTML=`<div class=\"res panel\">${body}<div class=\"acts\"><button class=\"btn pri big\" data-act=\"play\">🔁 Play Again<\/button><button class=\"btn big\" data-act=\"home\">🏠 Home<\/button><\/div><\/div>`;\n R=null;\n}\n\n/* ---------- DRAWING ---------- */\nfunction drawMag(x,y,w,h,top){\n const bot=top==='N'?'S':'N';\n ctx.fillStyle=PC[top];ctx.fillRect(x-w/2,y-h/2,w,h/2);ctx.fillStyle=PC[bot];ctx.fillRect(x-w/2,y,w,h/2);\n ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x-w/2,y-h/2,w,h);\n ctx.fillStyle='#fff';ctx.font='bold '+Math.round(w*.5)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';\n ctx.fillText(top,x,y-h/4);ctx.fillText(bot,x,y+h/4);\n}\nfunction draw(){\n if(!ctx||!R)return;const c=ctx,Rr=R.sup>0?290:190;\n c.save();if(R.shake>0){R.shake-=.016;c.translate((Math.random()-.5)*10,(Math.random()-.5)*10)}\n const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f172a');g.addColorStop(1,'#1e3a8a');c.fillStyle=g;c.fillRect(-20,-20,W+40,H+40);\n c.fillStyle='#fff';c.globalAlpha=.6;BG.forEach(s=>{c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill()});c.globalAlpha=1;\n const col=R.sup>0?'#fde047':'#7dd3fc',ph=(Date.now()/700)%1;\n c.fillStyle=col;c.globalAlpha=.08;c.beginPath();c.arc(R.mx,R.my,Rr,0,7);c.fill();\n c.strokeStyle=col;c.lineWidth=2;[0,.5].forEach(o=>{const p=(ph+o)%1;c.globalAlpha=.4*(1-p);c.beginPath();c.arc(R.mx,R.my,Rr*(.3+.7*p),0,7);c.stroke()});c.globalAlpha=1;\n c.setLineDash([6,7]);c.lineWidth=2;\n R.items.forEach(it=>{if(it.pull){c.strokeStyle=it.pull>0?'#4ade80':'#f87171';c.globalAlpha=.7;c.beginPath();c.moveTo(R.mx,R.my);c.lineTo(it.x,it.y);c.stroke()}});\n c.setLineDash([]);c.globalAlpha=1;\n R.items.forEach(it=>{\n  if(it.t==='mag')drawMag(it.x,it.y,26,48,it.pole==='N'?'S':'N');\n  else if(it.t==='star'){c.shadowColor='#fde047';c.shadowBlur=22;c.font='44px serif';c.textAlign='center';c.textBaseline='middle';c.fillText('⭐',it.x,it.y);c.shadowBlur=0}\n  else{c.font='34px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(it.e,it.x,it.y);c.font='bold 11px sans-serif';c.fillStyle='#e2e8f0';c.fillText(it.n,it.x,it.y+28)}\n });\n R.pt.forEach(p=>{c.globalAlpha=Math.max(0,p.l/.6);c.fillStyle=p.c;c.fillRect(p.x,p.y,5,5)});c.globalAlpha=1;\n if(R.sup>0){c.shadowColor='#fde047';c.shadowBlur=24}\n drawMag(R.mx,R.my,36,64,R.pole);c.shadowBlur=0;\n R.fx.forEach(f=>{c.globalAlpha=Math.min(1,f.l*1.6);c.fillStyle=f.c;c.font='bold 20px sans-serif';c.textAlign='center';c.fillText(f.s,f.x,f.y)});c.globalAlpha=1;\n c.restore();\n}\n\n/* ---------- EDITOR ---------- */\nfunction editor(){\n const y=scrollY,it=E.t===0;\n const rows=it?`<p class=\"hint\">These objects fall during the game. Type an emoji, a name, and choose whether a magnet attracts it. Keep at least one of each kind.<\/p>`+D.items.map((x,i)=>`<div class=\"qe obj\"><input type=\"text\" class=\"em\" data-f=\"ie\" data-i=\"${i}\" value=\"${esc(x.e)}\" maxlength=\"4\" aria-label=\"Emoji\"><input type=\"text\" data-f=\"in\" data-i=\"${i}\" value=\"${esc(x.n)}\" aria-label=\"Name\"><select data-f=\"im\" data-i=\"${i}\"><option value=\"1\" ${x.m?'selected':''}>✅ Magnetic<\/option><option value=\"0\" ${x.m?'':'selected'}>❌ Non-magnetic<\/option><\/select><button class=\"x\" data-act=\"deli\" data-i=\"${i}\">🗑<\/button><\/div>`).join('')\n :`<p class=\"hint\">Power-up star questions. Tap the green circle to mark the correct answer.<\/p>`+D.qs.map((q,qi)=>`<div class=\"qe\"><div class=\"qh\"><b>Question ${qi+1}<\/b><button class=\"x\" data-act=\"delq\" data-qi=\"${qi}\">🗑 Delete<\/button><\/div><textarea rows=\"2\" data-f=\"q\" data-qi=\"${qi}\">${esc(q.q)}<\/textarea>${q.o.map((o,oi)=>`<div class=\"oe\"><input type=\"radio\" name=\"r${qi}\" data-f=\"a\" data-qi=\"${qi}\" data-oi=\"${oi}\" ${q.a===oi?'checked':''}><input type=\"text\" data-f=\"o\" data-qi=\"${qi}\" data-oi=\"${oi}\" value=\"${esc(o)}\">${q.o.length>2?`<button class=\"x\" data-act=\"delopt\" data-qi=\"${qi}\" data-oi=\"${oi}\">✕<\/button>`:''}<\/div>`).join('')}${q.o.length<4?`<button class=\"btn sm\" data-act=\"addopt\" data-qi=\"${qi}\">＋ option<\/button>`:''}<\/div>`).join('');\n app.innerHTML=`<div class=\"top\"><button class=\"btn sm\" data-act=\"home\">← Back<\/button><div class=\"name\"><h1>✏️ Edit Game<\/h1><\/div><span style=\"width:70px\"><\/span><\/div>\n <div class=\"tabs\"><button data-act=\"tab\" data-i=\"0\" class=\"${it?'on':''}\">🧲 Falling Objects<\/button><button data-act=\"tab\" data-i=\"1\" class=\"${it?'':'on'}\">❓ Power-Up Questions<\/button><\/div>${rows}\n <div class=\"bar\"><button class=\"btn\" data-act=\"${it?'addi':'addq'}\">＋ Add ${it?'object':'question'}<\/button><button class=\"btn\" data-act=\"reset\">↺ Reset this tab<\/button><button class=\"btn\" data-act=\"export\">⬇ Export JSON<\/button><label class=\"btn\">⬆ Import JSON<input type=\"file\" id=\"imp\" accept=\".json,application/json\" hidden><\/label><button class=\"btn pri\" data-act=\"home\">✔ Done<\/button><\/div>`;\n scrollTo(0,y);\n}\n\n/* ---------- EVENTS ---------- */\napp.addEventListener('click',e=>{\n const b=e.target.closest('[data-act]');if(!b)return;const k=b.dataset,s=D.settings;\n switch(k.act){\n  case'mode':s.mode=k.v;save();home();break;\n  case'nt':s.nTeams=+k.v;save();home();break;\n  case'play':play();break;\n  case'go':hideOv();R.state='play';last=performance.now();raf=requestAnimationFrame(loop);break;\n  case'next':G.cur++;ready();break;\n  case'qa':answerQ(+k.i);break;\n  case'flip':flipPole();break;\n  case'quit':home();break;\n  case'home':save();home();break;\n  case'edit':editor();break;\n  case'tab':E.t=+k.i;editor();break;\n  case'addi':D.items.push({e:'❓',n:'New object',m:true});save();editor();scrollTo(0,document.body.scrollHeight);break;\n  case'deli':D.items.splice(+k.i,1);save();editor();break;\n  case'addq':D.qs.push({q:'New question',o:['Answer A','Answer B','Answer C','Answer D'],a:0});save();editor();scrollTo(0,document.body.scrollHeight);break;\n  case'delq':if(confirm('Delete this question?')){D.qs.splice(+k.qi,1);save();editor()}break;\n  case'addopt':D.qs[+k.qi].o.push('New option');save();editor();break;\n  case'delopt':{const q=D.qs[+k.qi],oi=+k.oi;q.o.splice(oi,1);if(q.a===oi)q.a=0;else if(q.a>oi)q.a--;save();editor();break}\n  case'reset':if(confirm('Reset this tab to the original content?')){if(E.t===0)D.items=JSON.parse(JSON.stringify(BASE.items));else D.qs=JSON.parse(JSON.stringify(BASE.qs));save();editor()}break;\n  case'export':file(JSON.stringify({items:D.items,qs:D.qs},null,1),'science4_magnet_rush.json','application/json');break;\n  case'dl':download();break;\n }\n});\nfunction onInput(e){\n const t=e.target,f=t.dataset.f;if(!f)return;const s=D.settings,i=+t.dataset.i,qi=+t.dataset.qi,oi=+t.dataset.oi;\n if(f==='team')s.teams[i]=t.value;\n else if(f==='time')s.time=Math.max(30,Math.min(900,+t.value||180));\n else if(f==='snd')s.sound=t.checked;\n else if(f==='ie')D.items[i].e=t.value;\n else if(f==='in')D.items[i].n=t.value;\n else if(f==='im')D.items[i].m=t.value==='1';\n else if(f==='q')D.qs[qi].q=t.value;\n else if(f==='o')D.qs[qi].o[oi]=t.value;\n else if(f==='a')D.qs[qi].a=oi;\n save();\n}\napp.addEventListener('input',onInput);app.addEventListener('change',onInput);\napp.addEventListener('change',e=>{\n if(e.target.id!=='imp'||!e.target.files[0])return;\n const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);\n  if(!Array.isArray(j.items)||!Array.isArray(j.qs))throw 0;D.items=j.items;D.qs=j.qs;save();editor();alert('Imported!')}catch(x){alert('Sorry, that file is not a valid Magnet Rush file.')}};\n r.readAsText(e.target.files[0]);\n});\ndocument.addEventListener('keydown',e=>{\n if(!G||!R||!cv)return;const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;\n if(e.code==='Space'||e.key==='f'){e.preventDefault();flipPole()}\n const d={ArrowLeft:[-50,0],ArrowRight:[50,0],ArrowUp:[0,-50],ArrowDown:[0,50]}[e.key];\n if(d){e.preventDefault();R.tx=Math.max(20,Math.min(W-20,R.tx+d[0]));R.ty=Math.max(170,Math.min(H-40,R.ty+d[1]))}\n});\nfunction download(){\n D.stamp=Date.now();save();\n const c=document.documentElement.cloneNode(true);\n c.querySelector('#app').innerHTML='';\n c.querySelector('#qdata').textContent=JSON.stringify(D).replace(/<\/g,'\\\\u003c');\n file('<!DOCTYPE html>\\n'+c.outerHTML,'Science4_Magnet_Rush_Game.html','text/html');\n}\nhome();\n<\/script>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Science 4 – Memory Match: Forces & Magnets<\/title>\n<style>\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,sans-serif;background:linear-gradient(160deg,#ede9fe,#e0f2fe 50%,#dcfce7);min-height:100vh;color:#1e293b}\n#app{max-width:900px;margin:0 auto;padding:16px 14px 40px}\nh1{margin:6px 0;font-size:clamp(1.5rem,5vw,2.3rem)}h2{margin:0 0 10px;font-size:1.1rem}\n.hero{text-align:center;padding:14px 0 6px}.hero p{margin:4px 0;color:#475569}\n.badge{display:inline-block;background:#1e293b;color:#fff;border-radius:99px;padding:4px 14px;font-size:.78rem;letter-spacing:.08em}\n.panel{background:#fff;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 4px 14px #0f172a1a}\n.seg{display:flex;gap:8px;flex-wrap:wrap}\n.seg button,.tabs button{flex:1;min-width:130px;padding:12px;border:2px solid #cbd5e1;border-radius:14px;background:#f8fafc;font:inherit;font-weight:700;cursor:pointer}\n.seg button.on,.tabs button.on{background:#1e293b;color:#fff;border-color:#1e293b}\n.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px}.row label{font-weight:700;font-size:.92rem}\ninput[type=number],input[type=text],textarea{font:inherit;padding:8px 10px;border:2px solid #cbd5e1;border-radius:10px;width:100%}\ninput[type=number]{width:90px;margin-left:6px}\n.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:12px}.teams input{border-width:3px}\n.cnt{display:flex;gap:6px;align-items:center;margin-top:12px;font-weight:700}\n.cnt button{width:44px;height:40px;border-radius:10px;border:2px solid #cbd5e1;background:#f8fafc;font:inherit;font-weight:800;cursor:pointer}\n.cnt button.on{background:#1e293b;color:#fff;border-color:#1e293b}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr) ransform .25s}\n.card .f{display:none}.card .b{font-size:2rem}\n.card.up{background:#fff;color:#1e293b;box-shadow:0 4px 0 #94a3b8;border:3px solid #6366f1;transform:rotateY(0)}\n.card.up .f{display:block}.card.up .b{display:none}\n.card.done{background:#dcfce7;color:#14532d;border:3px solid #16a34a;box-shadow:none;cursor:default}\n.card.done .f{display:block}.card.done .b{display:none}\n.card.bad{border-color:#dc2626;background:#fee2e2}\n.fb{text-align:center;font-weight:800;min-height:26px;margin-top:12px}\n.res{text-align:center}.res .big{font-size:4rem;font-weight:900;margin:6px 0}\n.rank{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 16px;margin:8px 0;font-weight:800;border-left:10px solid var(--c)}.rank.win{background:#fef9c3}.rank em{margin-left:auto;font-style:normal;font-size:1.3rem}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{min-width:0;padding:8px 10px;font-size:.85rem}\n.hint{color:#475569;font-size:.9rem}\n.qe{background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;box-shadow:0 2px 8px #0f172a14;display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:8px;align-items:center}\n.x{border:0;background:#fee2e2;border-radius:8px;cursor:pointer;padding:6px 10px;font:inherit}\n.bar{position:sticky;bottom:0;background:#ffffffee;padding:10px;border-radius:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;box-shadow:0 -4px 14px #0f172a1a;margin-top:14px}\n@media(max-width:560px){.board{grid-template-columns:repeat(3,1fr)}.qe{grid-template-columns:auto 1fr auto}.qe .eq{display:none}}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\"><\/div>\n<script id=\"qdata\" type=\"application/json\">\n{\"stamp\":1,\"settings\":{\"mode\":\"solo\",\"nTeams\":2,\"teams\":[\"Team 1\",\"Team 2\",\"Team 3\",\"Team 4\"],\"time\":180,\"sound\":true},\n\"decks\":[\n{\"id\":\"forces\",\"icon\":\"💪\",\"name\":\"Force & Example\",\"desc\":\"Match each force to what it does\",\"color\":\"#ef476f\",\"pairs\":[\n{\"a\":\"Pushing\",\"b\":\"Flattening a lump of clay\"},\n{\"a\":\"Pulling\",\"b\":\"A spring extends\"},\n{\"a\":\"Stretching\",\"b\":\"A rubber band gets longer and thinner\"},\n{\"a\":\"Bending\",\"b\":\"A metal rod takes a curved shape\"},\n{\"a\":\"Twisting\",\"b\":\"Wringing out a wet cloth\"},\n{\"a\":\"Squeezing\",\"b\":\"A sponge decreases in size\"},\n{\"a\":\"Tension\",\"b\":\"The force that stretches an object\"},\n{\"a\":\"Compression\",\"b\":\"Squeezes an object from all sides\"},\n{\"a\":\"Torsion\",\"b\":\"A twisting force\"},\n{\"a\":\"Shear\",\"b\":\"One part slides past another part\"}]},\n{\"id\":\"magnets\",\"icon\":\"🧲\",\"name\":\"Magnet Match\",\"desc\":\"Poles, attraction and magnetic force\",\"color\":\"#118ab2\",\"pairs\":[\n{\"a\":\"Like poles\",\"b\":\"Repel\"},\n{\"a\":\"Opposite poles\",\"b\":\"Attract\"},\n{\"a\":\"Two poles of a magnet\",\"b\":\"North and South\"},\n{\"a\":\"Magnetic force\",\"b\":\"A force that acts without touching\"},\n{\"a\":\"Compass\",\"b\":\"Uses a magnet to show direction\"},\n{\"a\":\"Thicker material\",\"b\":\"Weakens the magnetic force\"},\n{\"a\":\"Iron nail\",\"b\":\"Attracted to a magnet\"},\n{\"a\":\"Plastic spoon\",\"b\":\"Not attracted to a magnet\"},\n{\"a\":\"Paper clip\",\"b\":\"Magnetic object\"},\n{\"a\":\"Wooden stick\",\"b\":\"Non-magnetic object\"}]}\n]}\n<\/script>\n<script>\nconst $=s=>document.querySelector(s),app=$('#app'),KEY='sci4_w8_memory_v1';\nconst BASE=JSON.parse($('#qdata').textContent);let D=BASE;\ntry{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.stamp===BASE.stamp)D=s}catch(e){}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};\nconst fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');\nconst TC=['#ef476f','#118ab2','#06a77d','#f59e0b'];\nlet G=null,E={d:0},ac;\nfunction beep(f,d=.12){if(!D.settings.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}\nfunction stop(){if(G&&G.tm){clearInterval(G.tm);G.tm=0}}\nfunction file(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}\nconst valid=d=>d.pairs.filter(p=>p.a.trim()&&p.b.trim());\n\nfunction home(){\n stop();G=null;const s=D.settings,team=s.mode==='team';\n app.innerHTML=`<header class=\"hero\"><div class=\"badge\">SCIENCE 4 • TERM 2 • WEEK 8<\/div><h1>🃏 Memory Match: Forces &amp; Magnets<\/h1><p>Flip two cards to find a matching pair. Clear the board, then play a new one!<\/p><\/header>\n <section class=\"panel\"><h2>1 · Choose how to play<\/h2>\n <div class=\"seg\"><button data-act=\"mode\" data-v=\"solo\" class=\"${team?'':'on'}\">🙋 Solo Player<\/button><button data-act=\"mode\" data-v=\"team\" class=\"${team?'on':''}\">👥 Team Play<\/button><\/div>\n ${team?`<div class=\"cnt\">Teams: ${[2,3,4].map(n=>`<button data-act=\"nt\" data-v=\"${n}\" class=\"${s.nTeams==n?'on':''}\">${n}<\/button>`).join('')}<\/div>\n <div class=\"teams\">${s.teams.slice(0,s.nTeams).map((t,i)=>`<input type=\"text\" data-f=\"team\" data-i=\"${i}\" value=\"${esc(t)}\" maxlength=\"20\" style=\"border-color:${TC[i]}\" aria-label=\"Team ${i+1} name\">`).join('')}<\/div>`:''}\n <div class=\"row\"><label>⏱ Timer (seconds)<input type=\"number\" data-f=\"time\" min=\"30\" max=\"900\" step=\"30\" value=\"${s.time}\"><\/label><label><input type=\"checkbox\" data-f=\"snd\" ${s.sound?'checked':''}> 🔊 Sound<\/label><\/div><\/section>\n <section class=\"panel\"><h2>2 · Pick a card set<\/h2><div class=\"grid\">${D.decks.map(d=>`<button class=\"deck\" style=\"--c:${d.color}\" data-act=\"play\" data-id=\"${d.id}\"><div class=\"ic\">${d.icon}<\/div><b>${esc(d.name)}<\/b><small>${esc(d.desc)}<br>${valid(d).length} pairs<\/small><\/button>`).join('')}\n <button class=\"deck\" style=\"--c:#1e293b\" data-act=\"play\" data-id=\"mix\"><div class=\"ic\">🎲<\/div><b>Mega Mix<\/b><small>All sets together<br>${D.decks.reduce((n,d)=>n+valid(d).length,0)} pairs<\/small><\/button><\/div><\/section>\n <div class=\"acts\"><button class=\"btn\" data-act=\"edit\">✏️ Edit Cards<\/button><button class=\"btn pri\" data-act=\"dl\">⬇️ Download Game (.html)<\/button><\/div>\n <p class=\"hint\" style=\"text-align:center\">Scoring: +10 per match, +5 streak bonus (solo, from 3 in a row), +20 for clearing a board. Each board has up to 6 pairs.<\/p>`;\n}\n\nfunction play(id){\n const decks=id==='mix'?D.decks:D.decks.filter(d=>d.id===id);let pool=[];\n decks.forEach(d=>valid(d).forEach(p=>pool.push(p)));\n if(pool.length<2){alert('Add at least 2 pairs in ✏️ Edit Cards first.');return}\n const s=D.settings,n=s.mode==='team'?s.nTeams:1;\n G={id,pool,sc:Array(n).fill(0),turn:0,streak:0,ok:0,tries:0,boards:0,open:[],over:false,lock:false,endAt:Date.now()+s.time*1000};\n const title=id==='mix'?'🎲 Mega Mix':decks[0].icon+' '+esc(decks[0].name);\n app.innerHTML=`<div class=\"top\"><button class=\"btn sm\" data-act=\"quit\">✖ Quit<\/button><div class=\"name\">${title}<\/div><div class=\"clock\" id=\"clk\">${fmt(s.time)}<\/div><\/div><div class=\"tbar\"><i id=\"tb\"><\/i><\/div><div class=\"score\" id=\"sb\"><\/div><div id=\"qa\"><\/div>`;\n newBoard();G.tm=setInterval(tick,200);beep(520,.15);\n}\nfunction tick(){\n const ms=G.endAt-Date.now(),s=Math.max(0,Math.ceil(ms/1000)),c=$('#clk');\n c.textContent=fmt(s);c.classList.toggle('warn',s<=30);$('#tb').style.width=Math.max(0,ms/(D.settings.time*10))+'%';\n if(s<=10&&s>0&&G.lb!==s){G.lb=s;beep(600,.06)}\n if(ms<=0)endGame();\n}\nfunction scoreBar(){\n const s=D.settings;\n $('#sb').innerHTML=s.mode==='team'?G.sc.map((v,i)=>`<span class=\"${i===G.turn?'act':''}\" style=\"--c:${TC[i]}\">${esc(s.teams[i])}: ${v}<\/span>`).join(''):`<span>⭐ ${G.sc[0]}<\/span><span>🔥 Streak ${G.streak}<\/span><span>🃏 Boards ${G.boards}<\/span>`;\n}\nfunction newBoard(){\n const ps=shuffle(G.pool).slice(0,6);let cards=[];\n ps.forEach((p,k)=>{cards.push({k,t:p.a},{k,t:p.b})});\n G.cards=shuffle(cards);G.left=ps.length;G.open=[];G.lock=false;\n const team=D.settings.mode==='team';\n $('#qa').innerHTML=`${team?`<div class=\"turn\" id=\"tn\" style=\"--c:${TC[G.turn]}\">👉 ${esc(D.settings.teams[G.turn])}, flip two cards!<\/div>`:''}\n <div class=\"board\">${G.cards.map((c,i)=>`<button class=\"card\" data-act=\"flip\" data-i=\"${i}\"><span class=\"b\">🧲<\/span><span class=\"f\">${esc(c.t)}<\/span><\/button>`).join('')}<\/div><div class=\"fb\" id=\"fb\"><\/div>`;\n scoreBar();\n}\nconst cardEl=i=>document.querySelector('.card[data-i=\"'+i+'\"]');\nfunction flip(i){\n if(!G||G.over||G.lock)return;const el=cardEl(i);\n if(el.classList.contains('up')||el.classList.contains('done'))return;\n el.classList.add('up');G.open.push(i);beep(440,.05);\n if(G.open.length<2)return;\n G.lock=true;G.tries++;const [a,b]=G.open,solo=D.settings.mode!=='team';\n if(G.cards[a].k===G.cards[b].k){\n  setTimeout(()=>{\n   if(G.over)return;\n   [a,b].forEach(x=>{const e=cardEl(x);e.classList.remove('up');e.classList.add('done')});\n   const pts=10+(solo&&G.streak>=2?5:0);G.sc[G.turn]+=pts;G.streak++;G.ok++;G.left--;beep(880);\n   $('#fb').textContent='✅ Match! +'+pts;$('#fb').style.color='#16a34a';G.open=[];\n   if(G.left===0){G.sc[G.turn]+=20;G.boards++;$('#fb').textContent='🎉 Board cleared! +20 bonus';scoreBar();setTimeout(()=>{if(!G.over)newBoard()},1100)}\n   else{scoreBar();G.lock=false}\n  },450);\n }else{\n  [a,b].forEach(x=>cardEl(x).classList.add('bad'));beep(200,.2);\n  setTimeout(()=>{\n   if(G.over)return;\n   [a,b].forEach(x=>{const e=cardEl(x);e.classList.remove('up','bad')});\n   G.streak=0;G.open=[];$('#fb').textContent='';\n   if(!solo){G.turn=(G.turn+1)%G.sc.length;const t=$('#tn');t.style.setProperty('--c',TC[G.turn]);t.textContent='👉 '+D.settings.teams[G.turn]+', flip two cards!'}\n   scoreBar();G.lock=false;\n  },1100);\n }\n}\nfunction endGame(){\n stop();G.over=true;beep(660,.35);\n const s=D.settings,team=s.mode==='team';let body;\n if(team){\n  const r=G.sc.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v),top=r[0].v,w=r.filter(x=>x.v===top);\n  body=`<div class=\"big\">🏆<\/div><h1>${w.length>1?\"It's a tie!\":esc(s.teams[w[0].i])+' wins!'}<\/h1>`+r.map((x,k)=>`<div class=\"rank ${x.v===top?'win':''}\" style=\"--c:${TC[x.i]}\">${['🥇','🥈','🥉','4️⃣'][k]} ${esc(s.teams[x.i])}<em>${x.v} pts<\/em><\/div>`).join('')+`<p class=\"hint\">${G.ok} pairs found • ${G.boards} boards cleared<\/p>`;\n }else{\n  const acc=G.tries?Math.round(G.ok/G.tries*100):0;\n  body=`<div class=\"big\">${G.boards>=2?'🌟':G.ok>=6?'👍':'💪'}<\/div><h1>Time's up!<\/h1><div class=\"big\" style=\"color:#6366f1\">${G.sc[0]} pts<\/div><p><b>${G.ok}<\/b> pairs found • <b>${G.boards}<\/b> boards cleared • ${acc}% accuracy<\/p><p class=\"hint\">${acc>=70?'Sharp memory, scientist!':'Good try — play again to beat your score!'}<\/p>`;\n }\n app.innerHTML=`<div class=\"res panel\">${body}<div class=\"acts\"><button class=\"btn pri\" data-act=\"again\">🔁 Play Again<\/button><button class=\"btn\" data-act=\"home\">🏠 Home<\/button><\/div><\/div>`;\n}\n\nfunction editor(){\n const y=scrollY,d=D.decks[E.d];\n app.innerHTML=`<div class=\"top\"><button class=\"btn sm\" data-act=\"home\">← Back<\/button><div class=\"name\"><h1>✏️ Edit Cards<\/h1><\/div><span style=\"width:70px\"><\/span><\/div>\n <div class=\"tabs\">${D.decks.map((x,i)=>`<button data-act=\"tab\" data-i=\"${i}\" class=\"${i===E.d?'on':''}\">${x.icon} ${esc(x.name)}<\/button>`).join('')}<\/div>\n <p class=\"hint\">Each row is one matching pair — the two cards players must match. Keep text short. Changes save automatically; use <b>Download Game<\/b> on the home page to keep them inside the file.<\/p>\n ${d.pairs.map((p,i)=>`<div class=\"qe\"><b>${i+1}<\/b><input type=\"text\" data-f=\"a\" data-i=\"${i}\" value=\"${esc(p.a)}\" aria-label=\"Card A\"><span class=\"eq\">⇄<\/span><input type=\"text\" data-f=\"b\" data-i=\"${i}\" value=\"${esc(p.b)}\" aria-label=\"Card B\"><button class=\"x\" data-act=\"delp\" data-i=\"${i}\" title=\"Delete pair\">🗑<\/button><\/div>`).join('')}\n <div class=\"bar\"><button class=\"btn\" data-act=\"addp\">＋ Add pair<\/button><button class=\"btn\" data-act=\"reset\">↺ Reset this set<\/button><button class=\"btn\" data-act=\"export\">⬇ Export JSON<\/button><label class=\"btn\">⬆ Import JSON<input type=\"file\" id=\"imp\" accept=\".json,application/json\" hidden><\/label><button class=\"btn pri\" data-act=\"home\">✔ Done<\/button><\/div>`;\n scrollTo(0,y);\n}\n\napp.addEventListener('click',e=>{\n const b=e.target.closest('[data-act]');if(!b)return;const k=b.dataset,s=D.settings,d=D.decks[E.d];\n switch(k.act){\n  case'mode':s.mode=k.v;save();home();break;\n  case'nt':s.nTeams=+k.v;save();home();break;\n  case'play':play(k.id);break;\n  case'flip':flip(+k.i);break;\n  case'quit':home();break;\n  case'again':play(G.id);break;\n  case'home':save();home();break;\n  case'edit':E.d=0;editor();break;\n  case'tab':E.d=+k.i;editor();break;\n  case'addp':d.pairs.push({a:'New term',b:'Its match'});save();editor();scrollTo(0,document.body.scrollHeight);break;\n  case'delp':d.pairs.splice(+k.i,1);save();editor();break;\n  case'reset':{const o=BASE.decks.find(x=>x.id===d.id);if(o&&confirm('Reset this set to the original cards?')){D.decks[E.d]=JSON.parse(JSON.stringify(o));save();editor()}break}\n  case'export':file(JSON.stringify({decks:D.decks},null,1),'science4_memory_cards.json','application/json');break;\n  case'dl':download();break;\n }\n});\nfunction onInput(e){\n const t=e.target,f=t.dataset.f;if(!f)return;const s=D.settings;\n if(f==='team')s.teams[+t.dataset.i]=t.value;\n else if(f==='time')s.time=Math.max(30,Math.min(900,+t.value||180));\n else if(f==='snd')s.sound=t.checked;\n else D.decks[E.d].pairs[+t.dataset.i][f]=t.value;\n save();\n}\napp.addEventListener('input',onInput);app.addEventListener('change',onInput);\napp.addEventListener('change',e=>{\n if(e.target.id!=='imp'||!e.target.files[0])return;\n const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),ds=Array.isArray(j)?j:j.decks;\n  if(!Array.isArray(ds)||!ds.every(d=>d.id&&Array.isArray(d.pairs)))throw 0;D.decks=ds;E.d=0;save();editor();alert('Cards imported!')}catch(x){alert('Sorry, that file is not a valid cards file.')}};\n r.readAsText(e.target.files[0]);\n});\nfunction download(){\n D.stamp=Date.now();save();\n const c=document.documentElement.cloneNode(true);\n c.querySelector('#app').innerHTML='';\n c.querySelector('#qdata').textContent=JSON.stringify(D).replace(/<\/g,'\\\\u003c');\n file('<!DOCTYPE html>\\n'+c.outerHTML,'Science4_Memory_Match_Game.html','text/html');\n}\nhome();\n<\/script>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Science 4 – Forces & Magnets Game Zone<\/title>\n<style>\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,sans-serif;background:linear-gradient(160deg,#e0f2fe,#fdf2f8 55%,#fef9c3);min-height:100vh;color:#1e293b}\n#app{max-width:880px;margin:0 auto;padding:16px 14px 40px}\nh1{margin:6px 0;font-size:clamp(1.5rem,5vw,2.3rem)}h2{margin:0 0 10px;font-size:1.1rem}\n.hero{text-align:center;padding:14px 0 6px}.hero p{margin:4px 0;color:#475569}\n.badge{display:inline-block;background:#1e293b;color:#fff;border-radius:99px;padding:4px 14px;font-size:.78rem;letter-spacing:.08em}\n.panel{background:#fff;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 4px 14px #0f172a1a}\n.seg{display:flex;gap:8px;flex-wrap:wrap}\n.seg button,.tabs bu ap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{min-width:0;padding:8px 10px;font-size:.85rem}\n.hint{color:#475569;font-size:.9rem}\n.qe{background:#fff;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 2px 8px #0f172a14}\n.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}\n.oe{display:flex;gap:8px;align-items:center;margin:6px 0}.oe input[type=radio]{width:22px;height:22px;accent-color:#16a34a;flex:none}\n.x{border:0;background:#fee2e2;border-radius:8px;cursor:pointer;padding:4px 9px;font:inherit}\n.bar{position:sticky;bottom:0;background:#ffffffee;padding:10px;border-radius:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;box-shadow:0 -4px 14px #0f172a1a;margin-top:14px}\nfooter{text-align:center;color:#64748b;font-size:.85rem}\n@media(max-width:560px){.opts{grid-template-columns:1fr}.opts.two{grid-template-columns:1fr 1fr}}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\"><\/div>\n<script id=\"qdata\" type=\"application/json\">\n{\"stamp\":1,\"settings\":{\"mode\":\"solo\",\"nTeams\":2,\"teams\":[\"Team 1\",\"Team 2\",\"Team 3\",\"Team 4\"],\"time\":180,\"sound\":true},\n\"decks\":[\n{\"id\":\"forces\",\"icon\":\"💪\",\"name\":\"Force Fighters\",\"desc\":\"Push, pull, stretch, bend, twist & squeeze\",\"color\":\"#ef476f\",\"fixed\":false,\"qs\":[\n{\"q\":\"Which force is primarily responsible for stretching an object?\",\"o\":[\"Compression\",\"Tension\",\"Bending\",\"Torsion\"],\"a\":1},\n{\"q\":\"What happens to a spring when a compressive force is applied?\",\"o\":[\"It lengthens\",\"It shortens\",\"It twists\",\"It bends\"],\"a\":1},\n{\"q\":\"Which action demonstrates a bending force?\",\"o\":[\"Pulling a rope\",\"Squeezing a ball\",\"Folding a piece of paper\",\"Twisting a screwdriver\"],\"a\":2},\n{\"q\":\"What type of force is involved in wringing out a wet cloth?\",\"o\":[\"Compression\",\"Tension\",\"Bending\",\"Torsion\"],\"a\":3},\n{\"q\":\"Which force causes an object to decrease in volume from all sides?\",\"o\":[\"Tension\",\"Compression\",\"Shear\",\"Bending\"],\"a\":1},\n{\"q\":\"What is the result of applying a force beyond an object's elastic limit?\",\"o\":[\"It returns to its original shape\",\"It breaks immediately\",\"It undergoes permanent deformation\",\"It vibrates\"],\"a\":2},\n{\"q\":\"Which of these is an example of a tensile force?\",\"o\":[\"Pushing a door closed\",\"Hanging a picture on a nail\",\"Squeezing a tube of toothpaste\",\"Bending a wire\"],\"a\":1},\n{\"q\":\"What type of force is applied when kneading dough?\",\"o\":[\"Pure tension\",\"Primarily torsion\",\"A combination of compression, tension, and shear\",\"Primarily bending\"],\"a\":2},\n{\"q\":\"A force that causes one part of an object to slide past another part is called:\",\"o\":[\"Tension\",\"Compression\",\"Shear\",\"Bending\"],\"a\":2},\n{\"q\":\"Which best describes the effect of force on an object's shape?\",\"o\":[\"Force always causes an object to break\",\"Force can only change motion, not shape\",\"Force can change shape temporarily or permanently\",\"Force has no effect on shape\"],\"a\":2},\n{\"q\":\"Stretching a rubber band causes it to become…\",\"o\":[\"Shorter and thicker\",\"Longer and thinner\",\"Harder\",\"Heavier\"],\"a\":1},\n{\"q\":\"Squeezing a sponge causes it to…\",\"o\":[\"Grow bigger\",\"Decrease in size and expel water\",\"Float away\",\"Turn into clay\"],\"a\":1}]},\n{\"id\":\"magnets\",\"icon\":\"🧲\",\"name\":\"Magnet Masters\",\"desc\":\"Poles, attraction & magnetic force\",\"color\":\"#118ab2\",\"fixed\":false,\"qs\":[\n{\"q\":\"Which of the following materials is NOT attracted to a magnet?\",\"o\":[\"Glass\",\"Iron nail\",\"Metallic paper clip\",\"Another magnet\"],\"a\":0},\n{\"q\":\"What are the two poles of a magnet called?\",\"o\":[\"East pole and west pole\",\"Red pole and blue pole\",\"North pole and south pole\",\"Top pole and bottom pole\"],\"a\":2},\n{\"q\":\"Which of the following materials is attracted to a magnet?\",\"o\":[\"Glass\",\"Iron\",\"Plastic\",\"Wood\"],\"a\":1},\n{\"q\":\"What happens when two like poles of magnets meet?\",\"o\":[\"They attract\",\"They repel\",\"Nothing happens\",\"They melt\"],\"a\":1},\n{\"q\":\"What happens when opposite poles of magnets meet?\",\"o\":[\"They attract\",\"They repel\",\"Nothing happens\",\"They spin\"],\"a\":0},\n{\"q\":\"Magnetic force can pass through which materials?\",\"o\":[\"Paper, cardboard and thin plastic\",\"Only thick steel\",\"None at all\",\"Only water\"],\"a\":0},\n{\"q\":\"Why is magnetic force called a “force at a distance”?\",\"o\":[\"It needs glue\",\"It acts without touching the object\",\"It only works underwater\",\"It only pulls heavy things\"],\"a\":1},\n{\"q\":\"What happens to magnetic force when the material between is thicker?\",\"o\":[\"It gets stronger\",\"It weakens\",\"It doubles\",\"It turns into heat\"],\"a\":1},\n{\"q\":\"Which everyday device uses a magnet to show direction?\",\"o\":[\"Compass\",\"Ruler\",\"Thermometer\",\"Clock\"],\"a\":0}]},\n{\"id\":\"tf\",\"icon\":\"✅\",\"name\":\"True or False Rush\",\"desc\":\"Quick-fire true or false!\",\"color\":\"#06a77d\",\"fixed\":true,\"qs\":[\n{\"q\":\"A magnet can attract objects if they are within the magnet's magnetic field.\",\"o\":[\"True\",\"False\"],\"a\":0},\n{\"q\":\"Magnets attract objects made of paper.\",\"o\":[\"True\",\"False\"],\"a\":1},\n{\"q\":\"North poles of magnets are attracted to the south poles of other magnets.\",\"o\":[\"True\",\"False\"],\"a\":0},\n{\"q\":\"All forces require physical contact.\",\"o\":[\"True\",\"False\"],\"a\":1},\n{\"q\":\"Magnets do not attract cloth.\",\"o\":[\"True\",\"False\"],\"a\":0},\n{\"q\":\"Some objects change shape or size when we apply force on them.\",\"o\":[\"True\",\"False\"],\"a\":0},\n{\"q\":\"A force can be applied to stop a moving ball.\",\"o\":[\"True\",\"False\"],\"a\":0},\n{\"q\":\"Force cannot change the shape of an object.\",\"o\":[\"True\",\"False\"],\"a\":1},\n{\"q\":\"A force can make an object move in a different direction.\",\"o\":[\"True\",\"False\"],\"a\":0},\n{\"q\":\"A force can cause a moving object to move faster or slower.\",\"o\":[\"True\",\"False\"],\"a\":0},\n{\"q\":\"Like poles of two magnets attract each other.\",\"o\":[\"True\",\"False\"],\"a\":1},\n{\"q\":\"A magnet can pull a paper clip without touching it.\",\"o\":[\"True\",\"False\"],\"a\":0}]},\n{\"id\":\"sort\",\"icon\":\"🔍\",\"name\":\"Magnetic or Not?\",\"desc\":\"Will a magnet attract it?\",\"color\":\"#f59e0b\",\"fixed\":true,\"qs\":[\n{\"q\":\"Will a magnet attract a PAPER CLIP?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":0},\n{\"q\":\"Will a magnet attract an IRON NAIL?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":0},\n{\"q\":\"Will a magnet attract a COIN?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":1},\n{\"q\":\"Will a magnet attract a PLASTIC SPOON?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":1},\n{\"q\":\"Will a magnet attract a WOODEN STICK?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":1},\n{\"q\":\"Will a magnet attract ALUMINUM FOIL?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":1},\n{\"q\":\"Will a magnet attract a piece of GLASS?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":1},\n{\"q\":\"Will a magnet attract PAPER?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":1},\n{\"q\":\"Will a magnet attract CLOTH?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":1},\n{\"q\":\"Will a magnet attract ANOTHER MAGNET (opposite poles facing)?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":0},\n{\"q\":\"Will a magnet stick to a REFRIGERATOR DOOR?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":0},\n{\"q\":\"Will a magnet stick to a WOODEN DOOR?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":1},\n{\"q\":\"Will a magnet attract a RUBBER BAND?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":1},\n{\"q\":\"Will a magnet attract CLAY?\",\"o\":[\"Yes – attracted\",\"No – not attracted\"],\"a\":1}]},\n{\"id\":\"fill\",\"icon\":\"✏️\",\"name\":\"Fill the Gap\",\"desc\":\"Complete the science statements\",\"color\":\"#8338ec\",\"fixed\":false,\"qs\":[\n{\"q\":\"A push or a pull is a ______.\",\"o\":[\"Force\",\"Shape\",\"Pole\",\"Maze\"],\"a\":0},\n{\"q\":\"When forces acting on something are ______, the object will move or change its motion.\",\"o\":[\"Balanced\",\"Unbalanced\",\"Zero\",\"Equal\"],\"a\":1},\n{\"q\":\"When forces acting on something are balanced, the object will not ______.\",\"o\":[\"Exist\",\"Change motion\",\"Fall apart\",\"Cool down\"],\"a\":1},\n{\"q\":\"Balanced forces push on ______ sides of something with equal strength.\",\"o\":[\"Opposite\",\"Only one\",\"The same\",\"Top\"],\"a\":0},\n{\"q\":\"A stationary object begins to move when it is ______.\",\"o\":[\"Pushed\",\"Painted\",\"Cooled\",\"Named\"],\"a\":0},\n{\"q\":\"Pressing, bending and stretching can change the ______ of an object.\",\"o\":[\"Name\",\"Shape\",\"Color word\",\"Day\"],\"a\":1},\n{\"q\":\"______ make a moving object go faster, slower or change direction.\",\"o\":[\"Shadows\",\"Forces\",\"Colors\",\"Sounds\"],\"a\":1},\n{\"q\":\"Pulling on a spring causes it to ______.\",\"o\":[\"Extend\",\"Melt\",\"Disappear\",\"Freeze\"],\"a\":0}]}\n]}\n<\/script>\n<script>\nconst $=s=>document.querySelector(s),app=$('#app'),KEY='sci4_w8_game_v1';\nconst BASE=JSON.parse($('#qdata').textContent);let D=BASE;\ntry{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.stamp===BASE.stamp)D=s}catch(e){}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};\nconst fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');\nconst TC=['#ef476f','#118ab2','#06a77d','#f59e0b'];\nlet G=null,E={d:0},ac;\nfunction beep(f,d=.12){if(!D.settings.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}\nfunction stop(){if(G&&G.tm){clearInterval(G.tm);G.tm=0}}\nfunction file(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}\n\n/* ---------- HOME ---------- */\nfunction home(){\n stop();G=null;const s=D.settings,team=s.mode==='team';\n app.innerHTML=`<header class=\"hero\"><div class=\"badge\">SCIENCE 4 • TERM 2 • WEEK 8<\/div><h1>🧲 Forces &amp; Magnets Game Zone<\/h1><p>Beat the clock! Answer as many questions as you can.<\/p><\/header>\n <section class=\"panel\"><h2>1 · Choose how to play<\/h2>\n <div class=\"seg\"><button data-act=\"mode\" data-v=\"solo\" class=\"${team?'':'on'}\">🙋 Solo Player<\/button><button data-act=\"mode\" data-v=\"team\" class=\"${team?'on':''}\">👥 Team Play<\/button><\/div>\n ${team?`<div class=\"cnt\">Teams: ${[2,3,4].map(n=>`<button data-act=\"nt\" data-v=\"${n}\" class=\"${s.nTeams==n?'on':''}\">${n}<\/button>`).join('')}<\/div>\n <div class=\"teams\">${s.teams.slice(0,s.nTeams).map((t,i)=>`<input type=\"text\" data-f=\"team\" data-i=\"${i}\" value=\"${esc(t)}\" maxlength=\"20\" style=\"border-color:${TC[i]}\" aria-label=\"Team ${i+1} name\">`).join('')}<\/div>`:''}\n <div class=\"row\"><label>⏱ Timer (seconds)<input type=\"number\" id=\"tm\" data-f=\"time\" min=\"30\" max=\"900\" step=\"30\" value=\"${s.time}\"><\/label><label><input type=\"checkbox\" data-f=\"snd\" ${s.sound?'checked':''}> 🔊 Sound<\/label><\/div><\/section>\n <section class=\"panel\"><h2>2 · Pick a game<\/h2><div class=\"grid\">${D.decks.map(d=>`<button class=\"deck\" style=\"--c:${d.color}\" data-act=\"play\" data-id=\"${d.id}\"><div class=\"ic\">${d.icon}<\/div><b>${esc(d.name)}<\/b><small>${esc(d.desc)}<br>${d.qs.length} questions<\/small><\/button>`).join('')}\n <button class=\"deck\" style=\"--c:#1e293b\" data-act=\"play\" data-id=\"mix\"><div class=\"ic\">🎲<\/div><b>Mega Mix<\/b><small>All games together<br>${D.decks.reduce((n,d)=>n+d.qs.length,0)} questions<\/small><\/button><\/div><\/section>\n <div class=\"acts\"><button class=\"btn\" data-act=\"edit\">✏️ Edit Questions<\/button><button class=\"btn pri\" data-act=\"dl\">⬇️ Download Game (.html)<\/button><\/div>\n <p class=\"hint\" style=\"text-align:center\">Tip: edit the questions, then download — your changes are saved inside the file so you can share or open it offline.<\/p>`;\n}\n\n/* ---------- PLAY ---------- */\nfunction play(id){\n const decks=id==='mix'?D.decks:D.decks.filter(d=>d.id===id);let pool=[];\n decks.forEach(d=>d.qs.forEach(q=>{if(q.q.trim()&&q.o.length>1)pool.push({...q,fixed:d.fixed})}));\n if(!pool.length){alert('This game has no questions yet. Add some in ✏️ Edit Questions.');return}\n const s=D.settings,n=s.mode==='team'?s.nTeams:1;\n G={id,pool:shuffle(pool),i:0,sc:Array(n).fill(0),turn:0,streak:0,ok:0,tot:0,over:false,lock:false,endAt:Date.now()+s.time*1000};\n const title=id==='mix'?'🎲 Mega Mix':decks[0].icon+' '+esc(decks[0].name);\n app.innerHTML=`<div class=\"top\"><button class=\"btn sm\" data-act=\"quit\">✖ Quit<\/button><div class=\"name\">${title}<\/div><div class=\"clock\" id=\"clk\">${fmt(s.time)}<\/div><\/div><div class=\"tbar\"><i id=\"tb\"><\/i><\/div><div class=\"score\" id=\"sb\"><\/div><div id=\"qa\"><\/div>`;\n showQ();G.tm=setInterval(tick,200);beep(520,.15);\n}\nfunction tick(){\n const ms=G.endAt-Date.now(),s=Math.max(0,Math.ceil(ms/1000)),c=$('#clk');\n c.textContent=fmt(s);c.classList.toggle('warn',s<=30);$('#tb').style.width=Math.max(0,ms/(D.settings.time*10))+'%';\n if(s<=10&&s>0&&G.lb!==s){G.lb=s;beep(600,.06)}\n if(ms<=0)endGame();\n}\nfunction scoreBar(){\n const s=D.settings;\n $('#sb').innerHTML=s.mode==='team'?G.sc.map((v,i)=>`<span class=\"${i===G.turn?'act':''}\" style=\"--c:${TC[i]}\">${esc(s.teams[i])}: ${v}<\/span>`).join(''):`<span>⭐ ${G.sc[0]}<\/span><span>🔥 Streak ${G.streak}<\/span><span>✅ ${G.ok}/${G.tot}<\/span>`;\n}\nfunction showQ(){\n if(G.i>=G.pool.length){G.pool=shuffle(G.pool);G.i=0}\n const q=G.pool[G.i++],team=D.settings.mode==='team';G.q=q;G.lock=false;\n let o=q.o.map((t,i)=>({t,c:i===q.a}));if(!q.fixed)o=shuffle(o);G.o=o;\n $('#qa').innerHTML=`${team?`<div class=\"turn\" style=\"--c:${TC[G.turn]}\">👉 ${esc(D.settings.teams[G.turn])}, it's your turn!<\/div>`:''}<div class=\"qc\">${esc(q.q)}<\/div>\n <div class=\"opts ${o.length===2?'two':''}\">${o.map((x,i)=>`<button class=\"opt\" data-act=\"ans\" data-i=\"${i}\"><span>${'ABCD'[i]}<\/span>${esc(x.t)}<\/button>`).join('')}<\/div><div class=\"fb\" id=\"fb\"><\/div>`;\n scoreBar();\n}\nfunction ans(i){\n if(!G||G.lock||G.over)return;G.lock=true;\n const ok=G.o[i].c,solo=D.settings.mode!=='team',bs=[...document.querySelectorAll('.opt')];\n bs.forEach((b,k)=>{b.disabled=true;if(G.o[k].c)b.classList.add('good')});\n G.tot++;\n if(ok){const pts=10+(solo&&G.streak>=2?5:0);G.ok++;G.streak++;G.sc[G.turn]+=pts;$('#fb').textContent='✅ Correct! +'+pts;$('#fb').style.color='#16a34a';beep(880)}\n else{bs[i].classList.add('bad');G.streak=0;$('#fb').textContent='❌ Not quite — the answer is '+G.o.find(x=>x.c).t;$('#fb').style.color='#dc2626';beep(200,.25)}\n scoreBar();\n setTimeout(()=>{if(!G||G.over)return;if(!solo)G.turn=(G.turn+1)%G.sc.length;showQ()},ok?900:1700);\n}\nfunction endGame(){\n stop();G.over=true;beep(660,.35);\n const s=D.settings,team=s.mode==='team';let body;\n if(team){\n  const r=G.sc.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v),top=r[0].v,w=r.filter(x=>x.v===top);\n  body=`<div class=\"big\">🏆<\/div><h1>${w.length>1?\"It's a tie!\":esc(s.teams[w[0].i])+' wins!'}<\/h1>`+r.map((x,k)=>`<div class=\"rank ${x.v===top?'win':''}\" style=\"--c:${TC[x.i]}\">${['🥇','🥈','🥉','4️⃣'][k]} ${esc(s.teams[x.i])}<em>${x.v} pts<\/em><\/div>`).join('')+`<p class=\"hint\">${G.ok} correct out of ${G.tot} answered<\/p>`;\n }else{\n  const acc=G.tot?Math.round(G.ok/G.tot*100):0;\n  body=`<div class=\"big\">${acc>=80?'🌟':acc>=50?'👍':'💪'}<\/div><h1>Time's up!<\/h1><div class=\"big\" style=\"color:#118ab2\">${G.sc[0]} pts<\/div><p><b>${G.ok}<\/b> correct out of <b>${G.tot}<\/b> answered (${acc}%)<\/p><p class=\"hint\">${acc>=80?'Outstanding scientist!':acc>=50?'Great effort — try again to beat your score!':'Keep practicing — you can do it!'}<\/p>`;\n }\n app.innerHTML=`<div class=\"res panel\">${body}<div class=\"acts\"><button class=\"btn pri\" data-act=\"again\">🔁 Play Again<\/button><button class=\"btn\" data-act=\"home\">🏠 Home<\/button><\/div><\/div>`;\n}\n\n/* ---------- EDITOR ---------- */\nfunction editor(){\n const y=scrollY,d=D.decks[E.d];\n app.innerHTML=`<div class=\"top\"><button class=\"btn sm\" data-act=\"home\">← Back<\/button><div class=\"name\"><h1>✏️ Edit Questions<\/h1><\/div><span style=\"width:70px\"><\/span><\/div>\n <div class=\"tabs\">${D.decks.map((x,i)=>`<button data-act=\"tab\" data-i=\"${i}\" class=\"${i===E.d?'on':''}\">${x.icon} ${esc(x.name)}<\/button>`).join('')}<\/div>\n <p class=\"hint\">Type to edit. Tap the green circle to mark the correct answer. Changes save automatically on this device — use <b>Download Game<\/b> on the home page to keep them inside the file.<\/p>\n ${d.qs.map((q,qi)=>`<div class=\"qe\"><div class=\"qh\"><b>Question ${qi+1}<\/b><button class=\"x\" data-act=\"delq\" data-qi=\"${qi}\" title=\"Delete question\">🗑 Delete<\/button><\/div>\n <textarea rows=\"2\" data-f=\"q\" data-qi=\"${qi}\">${esc(q.q)}<\/textarea>\n ${q.o.map((o,oi)=>`<div class=\"oe\"><input type=\"radio\" name=\"r${qi}\" data-f=\"a\" data-qi=\"${qi}\" data-oi=\"${oi}\" ${q.a===oi?'checked':''}><input type=\"text\" data-f=\"o\" data-qi=\"${qi}\" data-oi=\"${oi}\" value=\"${esc(o)}\">${q.o.length>2?`<button class=\"x\" data-act=\"delopt\" data-qi=\"${qi}\" data-oi=\"${oi}\">✕<\/button>`:''}<\/div>`).join('')}\n ${q.o.length<4?`<button class=\"btn sm\" data-act=\"addopt\" data-qi=\"${qi}\">＋ option<\/button>`:''}<\/div>`).join('')}\n <div class=\"bar\"><button class=\"btn\" data-act=\"addq\">＋ Add question<\/button><button class=\"btn\" data-act=\"reset\">↺ Reset this game<\/button><button class=\"btn\" data-act=\"export\">⬇ Export JSON<\/button><label class=\"btn\">⬆ Import JSON<input type=\"file\" id=\"imp\" accept=\".json,application/json\" hidden><\/label><button class=\"btn pri\" data-act=\"home\">✔ Done<\/button><\/div>`;\n scrollTo(0,y);\n}\n\n/* ---------- EVENTS ---------- */\napp.addEventListener('click',e=>{\n const b=e.target.closest('[data-act]');if(!b)return;const k=b.dataset,s=D.settings,d=D.decks[E.d];\n switch(b.dataset.act){\n  case'mode':s.mode=k.v;save();home();break;\n  case'nt':s.nTeams=+k.v;save();home();break;\n  case'play':play(k.id);break;\n  case'ans':ans(+k.i);break;\n  case'quit':home();break;\n  case'again':play(G.id);break;\n  case'home':save();home();break;\n  case'edit':E.d=0;editor();break;\n  case'tab':E.d=+k.i;editor();break;\n  case'addq':d.qs.push({q:'New question',o:['Answer A','Answer B','Answer C','Answer D'],a:0});save();editor();scrollTo(0,document.body.scrollHeight);break;\n  case'delq':if(confirm('Delete this question?')){d.qs.splice(+k.qi,1);save();editor()}break;\n  case'addopt':d.qs[+k.qi].o.push('New option');save();editor();break;\n  case'delopt':{const q=d.qs[+k.qi],oi=+k.oi;q.o.splice(oi,1);if(q.a===oi)q.a=0;else if(q.a>oi)q.a--;save();editor();break}\n  case'reset':{const o=BASE.decks.find(x=>x.id===d.id);if(o&&confirm('Reset this game to the original questions?')){D.decks[E.d]=JSON.parse(JSON.stringify(o));save();editor()}break}\n  case'export':file(JSON.stringify({decks:D.decks},null,1),'science4_questions.json','application/json');break;\n  case'dl':download();break;\n }\n});\nfunction onInput(e){\n const t=e.target,f=t.datas
